name: Qualité et non-régression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/hero-canonique-feu-tricolore]

permissions:
  contents: read

jobs:
  validate:
    name: Tests statiques et syntaxe
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check server.js
          node --check public/config.js
          node --check public/learning-expansion.js
          node --check public/immersive-courses.js
          node --check public/safe-mobility-campaigns.js
          node --check public/permit-categories.js
          node --check public/sw.js
      - name: Exécuter les contrôles du projet
        run: npm test
